<div class="feedback-container">
  <mat-card class="feedback-card">
    <mat-card-header>
      <div mat-card-avatar class="feedback-icon-container">
        <mat-icon class="feedback-icon">feedback</mat-icon>
      </div>
      <mat-card-title>Enviar Feedback</mat-card-title>
      <mat-card-subtitle>Envie suas sugestões e ajude a melhorar nossa plataforma.</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form class="feedback-form">
        <!-- Rating Stars -->
        <div class="rating-section">
          <p class="rating-label">Avaliação:</p>
          <div class="star-container">
            <div class="star-rating">
              <mat-icon
                *ngFor="let star of [1, 2, 3, 4, 5]"
                role="button"
                tabindex="0"
                [attr.aria-label]="'Avaliar com ' + star + ' estrela(s)'"
                [class.filled]="star <= (hoveredRating || rating)"
                [class.empty]="star > (hoveredRating || rating)"
                (click)="setRating(star)"
                (keydown.enter)="setRating(star)"
                (keydown.space)="setRating(star); $event.preventDefault()"
                (mouseenter)="setHoveredRating(star)"
                (mouseleave)="clearHoveredRating()"
                class="star-icon">
                {{ getStarIcon(star) }}
              </mat-icon>
            </div>
          </div>
          <p class="rating-text" *ngIf="rating > 0">
            {{ rating === 1 ? 'Péssimo' : 
               rating === 2 ? 'Ruim' : 
               rating === 3 ? 'Regular' : 
               rating === 4 ? 'Bom' : 'Excelente' }}
          </p>
        </div>

        <!-- Comment Section -->
        <div class="comment-section">
          <mat-form-field appearance="outline" class="comment-field">
            <mat-label>Comentários e Sugestões</mat-label>
            <textarea 
              matInput 
              [(ngModel)]="comment" 
              name="comment"
              rows="4"
              placeholder="Compartilhe suas ideias para melhorar a plataforma..."
              class="comment-textarea">
            </textarea>
          </mat-form-field>
        </div>
      </form>
    </mat-card-content>
    
    <mat-card-actions class="feedback-actions">
      <button mat-button (click)="cancel()" class="cancel-button">
        Cancelar
      </button>
      <button
        mat-raised-button
        color="primary"
        (click)="submitFeedback()"
        [disabled]="rating === 0 || isSubmitting"
        class="submit-button">
        <mat-icon>send</mat-icon>
        Enviar Feedback
      </button>
    </mat-card-actions>
  </mat-card>
</div>
